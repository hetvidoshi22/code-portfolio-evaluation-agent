name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Also guards against the score breakdown or the homepage rubric
      # drifting away from scoring.py.
      - run: python -m pytest tests -q

  web:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 pulls in undici 8, which needs Node >= 22.19. On Node 20 the
          # jsdom test environment throws before a single test runs.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Session state for multi-repository analysis: averages, capacity and the
      # guarantee that one failed repository never drops a sibling's result.
      - run: npm run test:web
      - run: npm run build
